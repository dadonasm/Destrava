<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destrava! · D&D Technology</title>
<style>
:root{--bg:#0e0f12;--panel:#16171c;--panel2:#1d1f26;--line:#2a2c35;--tx:#ececf1;--mut:#9a9cab;--gold:#e0b34a;--ok:#3fb27f;--warn:#e5a23a;--err:#e5534b;--acc:#e0b34a;--r:14px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);--btnpri:linear-gradient(180deg,#f0cd6b,#d4a62f);--btnpri-tx:#1b1400}
:root[data-theme=light]{--bg:#f3f3f6;--panel:#fff;--panel2:#f0f0f4;--line:#dcdce3;--tx:#1b1b1f;--mut:#5d5e6a;--gold:#8a6612;--acc:#8a6612;--sh:0 1px 2px rgba(20,20,40,.06),0 8px 24px rgba(20,20,40,.06);--btnpri:linear-gradient(180deg,#f3d27a,#dcae35);--btnpri-tx:#241a00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:15;min-height:58px}
header h1{font-size:17px;letter-spacing:.4px}header small{color:var(--mut)}
header .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--panel2);cursor:default;white-space:nowrap}
button.chip{cursor:pointer;font:inherit;font-size:12px}button.chip:hover{border-color:var(--acc);color:var(--tx)}
.chip.own-p{color:var(--ok);border-color:var(--ok)}.chip.own-t{color:var(--warn);border-color:var(--warn)}
.chip i.d{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.upd{position:relative}.upd.nova:after{content:"";position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--err);border:2px solid var(--panel)}

/* jornada */
.journey{display:flex;gap:0;padding:16px 22px 4px;overflow:auto;align-items:flex-start;max-width:1500px;margin:0 auto}
.jn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;flex:1;position:relative;color:var(--mut);font-size:12px;text-align:center}
.jn .c{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--panel);position:relative;z-index:1}
.jn:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:var(--line)}
.jn.done:not(:last-child):after{background:var(--ok)}
.jn.done .c{background:var(--ok);border-color:var(--ok);color:#fff}.jn.on .c{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 4px rgba(224,179,74,.18)}.jn.on{color:var(--tx);font-weight:600}.jn.done{color:var(--ok)}

main{max-width:1100px;margin:0 auto;padding:8px 22px 70px}main.wide{max-width:1500px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:18px;margin:0 0 4px}.card p.h{margin:0 0 14px;color:var(--mut);font-size:13.5px}
.card h3{font-size:14px;margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text],select{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit}
input[type=text]:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}.sp1{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);padding:9px 15px;transition:border-color .15s,transform .05s}
button:hover{border-color:var(--acc)}button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--btnpri);color:var(--btnpri-tx);border-color:#b98a14;font-weight:700}
button.dng{background:var(--err);border-color:var(--err);color:#fff;font-weight:700}
button.gh{background:transparent}
button.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.src{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel2)}
.src.sel{border-color:var(--acc)}.src .t{flex:1;min-width:0}.src .t b{display:block}.src .t span{color:var(--mut);font-size:12px;word-break:break-all}
.src input.l{width:44px;text-align:center;padding:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--mut)}
.tag.win{color:#5aa9ff;border-color:#5aa9ff}.tag.lin{color:var(--ok);border-color:var(--ok)}
.bar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9a7418,#f3d98b);transition:width .3s}
.big{font-size:26px;font-weight:700;letter-spacing:-.3px}.mut{color:var(--mut)}.mono{font-family:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}.kpi .big{font-size:22px}.kpi .mut{font-size:12px}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.ok .dot,.dot.ok{background:var(--ok)}.aviso .dot{background:var(--warn)}.erro .dot{background:var(--err)}
.cat{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel2)}
.cat .n{flex:1;min-width:0}.cat .n b{display:block}.cat .n span{color:var(--mut);font-size:12px}
.cat .cb{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.cat .cb i{display:block;height:100%;background:var(--acc);border-radius:99px}
.tg{position:relative;width:44px;height:24px;flex:none}.tg input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.tg s{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}.tg s:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+s{background:var(--ok)}.tg input:checked+s:after{left:23px}
.tg input:indeterminate+s{background:var(--warn)}.tg input:indeterminate+s:after{left:13px}
.tg input:focus-visible+s{outline:2px solid var(--acc);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
.p-ok{background:#16382b;color:#6fe0a8}.p-falha{background:#4a1f1c;color:#ff9189}.p-ignorado{background:#2c2c33;color:#aaa}.p-revisar{background:#4a3a14;color:#ffd27a}.p-desmarcado{background:#2c2c33;color:#c9c9d6}.p-pendente{background:#26304a;color:#9bb8ff}
:root[data-theme=light] .p-ok{background:#d9f3e6;color:#17714a}:root[data-theme=light] .p-falha{background:#fde0de;color:#a3241d}:root[data-theme=light] .p-ignorado,:root[data-theme=light] .p-desmarcado{background:#e8e8ee;color:#555}:root[data-theme=light] .p-revisar{background:#fdecc6;color:#7a5a05}:root[data-theme=light] .p-pendente{background:#dfe6fb;color:#2f4fa8}
.log{max-height:150px;overflow:auto;background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.browser{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel2)}
.browser .path{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.browser ul{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto}
.browser li{padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.browser li:hover{background:var(--panel)}
.warnbox,.errbox,.okbox,.infobox{border-radius:12px;padding:11px 14px;margin:10px 0;border:1px solid}
.warnbox{border-color:var(--warn);background:rgba(229,162,58,.1)}.errbox{border-color:var(--err);background:rgba(229,83,75,.1)}.okbox{border-color:var(--ok);background:rgba(63,178,127,.1)}.infobox{border-color:var(--line);background:var(--panel2)}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5);max-height:94vh;overflow:auto}
.modal h2{font-size:20px;margin:0 0 8px}
.seal{width:84px;height:84px;flex:none}.seal svg{width:100%;height:100%;border-radius:50%}
.pg{display:flex;gap:8px;align-items:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:12px 18px;z-index:80;box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:min(560px,92vw)}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}

.shell{display:flex;min-height:calc(100vh - 58px)}
#gaveta{width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:58px;height:calc(100vh - 58px);transition:width .2s;z-index:6}
#gaveta .sp{flex:1}
.gv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:12px;color:var(--mut)}
.gv:hover{background:var(--panel2);color:var(--tx)}.gv.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc);font-weight:600}
.gv .ic{font-size:19px;width:24px;text-align:center;flex:none;display:inline-flex;justify-content:center}
.row>select{width:auto;flex:1;min-width:150px}
button>svg,button>span>svg{width:16px;height:16px;vertical-align:-3px}
.gv .ic svg{width:21px;height:21px}
.gv .bd{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:99px;background:var(--warn);color:#1b1400;font-weight:700}
.gvfoot{font-size:12px;color:var(--mut);padding:8px 10px;word-break:break-word;line-height:1.3}.gvfoot b{display:block;color:var(--tx);font-size:12.5px}.gvfoot small{opacity:.55;font-size:10.5px;letter-spacing:.5px}
body.min #gaveta{width:62px}body.min .gv .lb,body.min .gvfoot,body.min .gv .bd{display:none}
.content{flex:1;min-width:0}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:158px;height:158px;flex:none;position:relative}.ring svg{width:100%;height:100%}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring .n b{font-size:44px;line-height:1;letter-spacing:-1px}.ring .n span{font-size:12px;color:var(--mut)}
.ring circle.pr{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.heroT{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.heroT small{font-size:11px;color:var(--mut);letter-spacing:.3px;text-align:center;max-width:120px}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;color:var(--mut);font-weight:600}
.ttl{display:flex;align-items:center;gap:8px}.ttl h2{font-size:26px;letter-spacing:-.4px}
.pen{border:0;background:transparent;color:var(--mut);padding:4px;border-radius:8px}.pen:hover{color:var(--acc);background:var(--panel2)}.pen svg{width:16px;height:16px;display:block}
.ttl input{font-size:22px;font-weight:700;padding:6px 10px;max-width:420px}
.mid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.8px;color:var(--mut);opacity:.6;cursor:pointer;border:0;background:transparent;padding:0}
.mid:hover{opacity:1}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;margin:0 4px 4px 0;border:1px solid}
.b-gold{background:var(--btnpri);color:var(--btnpri-tx);border-color:#b98a14}.b-ok{color:var(--ok);border-color:var(--ok)}.b-bad{color:var(--err);border-color:var(--err)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-mut{color:var(--mut);border-color:var(--line)}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.dn{color:var(--err)}.delta.eq{color:var(--mut)}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.ch{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ch .ico{width:34px;height:34px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--acc);margin-bottom:6px}.ch .ico svg{width:20px;height:20px}
.ch .k{font-size:11px;letter-spacing:1px;color:var(--mut);font-weight:600;text-transform:uppercase}
.ch .v{font-size:16px;font-weight:700;line-height:1.25;word-break:break-word}
.ch .d{font-size:12px;color:var(--mut);line-height:1.35}
.ch .m{display:flex;align-items:center;gap:8px;margin-top:8px}.ch .m b{font-size:13px;width:26px}
.mini{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;border-radius:99px}
.spd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.spd{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 10px 12px;text-align:center}
.spd svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.spd .num{font-size:24px;font-weight:800;line-height:1;margin-top:-6px}.spd .nm{font-weight:600;font-size:13px;margin-top:4px}.spd .vl{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.3}.spd .cl{font-size:11px;font-weight:700;margin-top:3px}
.ndl{transform:rotate(var(--r));transform-origin:60px 62px;animation:ndl 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ndl{from{transform:rotate(0deg)}}
.gst{opacity:.35}
.shelf{display:flex;gap:6px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.tr{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:84px;text-align:center}
.tr.lock{filter:grayscale(1);opacity:.32}.tr.cur{filter:none}
.tr small{font-size:11px;color:var(--mut);line-height:1.2}.tr b{font-size:12px}
.tr.cur .tl2{color:var(--acc)}
.ossel{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.os{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px;display:flex;gap:12px}
.os.bad{opacity:.55}.os.best{border-color:var(--acc)}
.os .sc{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none;border:3px solid}
.os h4{margin:0 0 3px;font-size:15px}.os small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.cen{display:flex;align-items:center;gap:10px;margin:8px 0}.cen .nm{width:290px;max-width:46%;font-size:13px}.cen .bar{flex:1}.cen b{width:96px;text-align:right}
.tip{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}.tip:last-child{border:0}
.tip .tx{flex:1;min-width:0}.tip .tx b{display:block}.tip .tx span{color:var(--mut);font-size:12.5px;word-break:break-word}
.empty{text-align:center;padding:34px 18px}
.empty h2{font-size:26px;margin:12px 0 6px;letter-spacing:-.4px}.empty p{max-width:600px;margin:8px auto;color:var(--mut)}
.shield{width:92px;height:92px;margin:0 auto;color:var(--acc)}
.seals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:20px 0 6px;text-align:left}
.sealc{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 13px}
.sealc svg{width:26px;height:26px;color:var(--ok);flex:none;margin-top:1px}.sealc b{display:block;font-size:13.5px}.sealc span{font-size:12px;color:var(--mut);line-height:1.35;display:block}
.walk{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;text-align:left;margin-top:14px}
.wk{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel2);position:relative}
.wk .nb{width:26px;height:26px;border-radius:50%;background:var(--btnpri);color:var(--btnpri-tx);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:8px}
.wk b{display:block;font-size:14px}.wk span{font-size:12.5px;color:var(--mut);line-height:1.4;display:block;margin-top:2px}.wk em{font-style:normal;font-size:10.5px;color:var(--acc);font-weight:700;letter-spacing:.5px}
.mk{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-top:10px;cursor:pointer}.mk:hover{border-color:var(--acc)}
.mk .sc{width:52px;height:52px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ba{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0 0;padding-top:14px;border-top:1px dashed var(--line)}.ba .bx{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 18px;text-align:center}.ba .bx b{display:block;font-size:30px}
.ba .ar{font-size:26px;color:var(--acc)}

/* gaveta histórico (empurra a ficha) */
.fw{display:flex;gap:16px;align-items:flex-start}.fm{flex:1;min-width:0}
.dr{flex:none;width:0;opacity:0;overflow:hidden;transition:width .28s ease,opacity .2s;position:sticky;top:72px;max-height:calc(100vh - 90px);background:var(--panel);border:0 solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.dr.open{width:380px;opacity:1;border-width:1px}
.dr .in{width:380px;padding:16px;overflow:auto;max-height:calc(100vh - 92px)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl .ev{position:relative;margin:0 0 14px}.tl .ev:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:3px solid var(--acc)}
.tl .ev.fi:before{background:var(--acc)}.tl small{color:var(--mut)}
.tl .ev label{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:inherit;color:inherit;cursor:pointer}
.nt{display:inline-block;min-width:34px;text-align:center;font-weight:800;padding:0 6px;border-radius:8px;border:2px solid;font-size:12.5px;margin-right:4px}
@media (max-width:1100px){.dr{position:fixed;right:12px;top:70px;bottom:12px;max-height:none;z-index:30;transform:translateX(calc(100% + 30px));width:min(400px,92vw);opacity:1;border-width:1px;transition:transform .25s;box-shadow:0 20px 60px rgba(0,0,0,.5)}.dr.open{transform:none;width:min(400px,92vw)}.dr .in{width:100%;max-height:none;height:100%}}

/* dados */
.cock{display:flex;height:34px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel2)}
.cock i{display:block;height:100%;transition:width .5s}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px}.lgd span{display:flex;align-items:center;gap:6px}.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.zn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.zc{border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--panel2);border-top:4px solid}
.zc b{display:block}.zc span{font-size:12.5px;color:var(--mut);line-height:1.4;display:block;margin-top:3px}
.z-v{border-top-color:var(--ok)}.z-a{border-top-color:var(--warn)}.z-r{border-top-color:var(--err)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tb{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);font-size:13px;cursor:pointer}.tb.on{border-color:var(--acc);color:var(--tx);font-weight:700}
.drow{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}.drow:last-child{border:0}
.drow .t{flex:1;min-width:0}.drow .t b{display:block;word-break:break-word}.drow .t span{font-size:12px;color:var(--mut);word-break:break-all;display:block}
.drow .sz{font-weight:700;white-space:nowrap}
.actbar{position:sticky;bottom:10px;background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:12px 16px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:8}

/* backup */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.side{position:sticky;top:72px}
.ringp{width:170px;height:170px;position:relative;flex:none}.ringp svg{width:100%;height:100%}.ringp .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ringp .n b{font-size:34px;line-height:1}.ringp .n span{font-size:12px;color:var(--mut)}
.chkl{list-style:none;margin:0;padding:0}.chkl li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.chkl li:last-child{border:0}
.ci{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:var(--mut)}
.chkl li.run .ci{border-color:var(--acc);border-top-color:transparent;animation:spin 1s linear infinite}.chkl li.ok .ci{background:var(--ok);border-color:var(--ok);color:#fff}.chkl li.wait{color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}
.rc{display:flex;gap:12px;border-radius:14px;padding:14px;border:1px solid;margin-bottom:10px}
.rc.g{border-color:var(--ok);background:rgba(63,178,127,.09)}.rc.y{border-color:var(--warn);background:rgba(229,162,58,.09)}.rc.r{border-color:var(--err);background:rgba(229,83,75,.09)}
.rc .ic2{font-size:22px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){#gaveta{width:60px}#gaveta .gv .lb,#gaveta .gvfoot,#gaveta .gv .bd{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mA{display:inline-block}.mB{display:none}
:root[data-theme=light] .mA{display:none}:root[data-theme=light] .mB{display:inline-block}

<body>
<header>
  <span id="mono"></span><h1>Destrava!</h1><small>by D&amp;D Technology</small>
  <span class="sp"></span>
  <span id="hown"></span><span id="hsrv"></span>
  <button class="chip upd" id="hver" title="Ver atualizações">v–</button>
  <button class="sm" id="theme" aria-label="Alternar tema claro e escuro">Claro / Escuro</button>
</header>
<div class="shell">
<aside id="gaveta" aria-label="Menu lateral"></aside>
<div class="content"><div class="journey hide" id="steps"></div>
<main id="main"></main></div>
</div>
<div id="layer"></div>
<script src="/web/logo.js"></script>
<script>
"use strict";
const TOKEN=(location.hash||"").slice(1)||"__DD_TOKEN__";
history.replaceState(null,"",location.pathname);
const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>[...(e||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>(+n||0).toLocaleString("pt-BR");
let FB=1024;
function fmt(n){n=+n||0;const u=["B","KB","MB","GB","TB"];let i=0;while(n>=FB&&i<4){n/=FB;i++}return (i?n.toFixed(i>=3?2:1):n.toFixed(0)).replace(".",",")+" "+u[i]}
function fdur(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h "+m+"min":m?m+"min "+(s%60)+"s":s+"s"}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function api(path,body){
  const o={headers:{"X-DD-Token":TOKEN}};
  if(body!==undefined){o.method="POST";o.body=JSON.stringify(body)}
  const r=await fetch(path,o);const j=await r.json().catch(()=>({erro:"resposta inválida"}));
  if(!r.ok){const e=new Error(j.erro||("HTTP "+r.status));e.codigo=j.codigo;e.escopo=j.escopo;e.status=r.status;throw e}
  return j;
}
let toastT=null;
function toast(m,kind){let t=$(".toast");if(t)t.remove();t=document.createElement("div");t.className="toast "+(kind||"");t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),kind==="err"?9000:5000)}
async function safe(fn){try{return await fn()}catch(e){onErr(e)}}
function onErr(e){
  if(e.codigo==="termo")return openGate();
  if(e.codigo==="os")return dialog({titulo:"Falta a autorização do cliente",html:`<p>${esc(e.message)}</p><p class="mut">Esta máquina é de terceiros. Registre o nome de quem autoriza na aba <b>OS</b>.</p>`,ok:"Ir para a aba OS"}).then(r=>{if(r)nav("os")});
  if(e.message==="ORFAOS")return;
  toast(e.message||String(e),"err");
}

/* ---------- ícones, gauges e troféus ---------- */
const IC={
 mapa:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
 backup:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-6h8v6"/>',
 dados:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
 maq:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 20h20"/>',
 os:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 17.5h4"/>',
 shield:'<path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10.5-4.6-1.8-8-5.5-8-10.5v-6z"/><path d="M8.3 12l2.7 2.7 4.8-5"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 eye:'<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 doc:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>',
 cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
 ram:'<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6 16v3M10 16v3M14 16v3M18 16v3M6 11.5h3M11 11.5h3M16 11.5h2"/>',
 disk:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="17" cy="12" r="1.2"/><path d="M6 12h6"/>',
 gpu:'<rect x="2.5" y="7" width="19" height="10" rx="1.5"/><circle cx="9" cy="12" r="2.8"/><path d="M15 10h4M15 14h4"/>',
 sys:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
 bat:'<rect x="2.5" y="8" width="17" height="8" rx="2"/><path d="M21.5 11v2M6 12h6"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19z"/>',
 hist:'<path d="M4 12a8 8 0 108-8"/><path d="M4 4v4h4M12 8v4l3 2"/>',
 cmp:'<rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14" y="5" width="7" height="14" rx="1.5"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;
const FX=[[25,"#e5534b","Crítica"],[50,"#ff8a3d","Fraca"],[75,"#e5a23a","Regular"],[95,"#8bc34a","Muito boa"],[100,"#3fb27f","Excelente"]];
const nivel=n=>n<=25?1:n<=50?2:n<=75?3:n<=95?4:5;
const COR=n=>FX[nivel(n)-1][1];
const CLS=n=>FX[nivel(n)-1][2];
const TRN=["","Ábaco de Pedra","Era das Válvulas","PC Bege","Notebook Fino","A Pera"];
const TRF=["","até 25","26 a 50","51 a 75","76 a 95","96 a 100"];
function arcp(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
function needle(n,cls,col){const deg=(Math.max(0,Math.min(100,n))*1.8).toFixed(1);return `<g class="ndl ${cls||""}" style="--r:${deg}deg"><line x1="60" y1="62" x2="20" y2="62" stroke="${col||"var(--tx)"}" stroke-width="2.6" stroke-linecap="round"/></g>`}
/* velocímetro de 5 faixas (ponteiro = nota). n2 = segundo ponteiro opcional (comparação) */
function speedo(n,o){o=o||{};let bands="",lo=0;FX.forEach(f=>{const a0=180+lo*1.8+.7,a1=180+f[0]*1.8-.7;bands+=`<path d="${arcp(60,62,46,a0,a1)}" stroke="${f[1]}" stroke-width="11" fill="none"/>`;lo=f[0]});
  const sz=o.max?`style="max-width:${o.max}px"`:"";
  return `<svg viewBox="0 0 120 74" ${sz} role="img" aria-label="${esc(o.label||"Nota")} ${n} de 100, ${CLS(n)}">${bands}${o.ghost!=null?needle(o.ghost,"gst"):""}${needle(n)}<circle cx="60" cy="62" r="5" fill="var(--tx)"/><circle cx="60" cy="62" r="2" fill="var(--panel)"/></svg>`}
function ring(n,sz){const r=52,c=2*Math.PI*r,o=c*(1-n/100);return `<div class="ring" style="${sz?`width:${sz}px;height:${sz}px`:""}"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="pr" cx="60" cy="60" r="${r}" fill="none" stroke="${COR(n)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 60 60)"/></svg><div class="n"><b>${n}</b><span>de 100</span></div></div>`}
let TU=0;
function trophy(nv,h){
  const u="t"+(++TU),mats=[null,["#9b8a79","#5b4d41","#c4b49f"],["#e9a85f","#8a5524","#f6cf9a"],["#f1f4f8","#98a2b3","#ffffff"],["#ffe28a","#c28a12","#fff3bf"],["#f2fcff","#74d0f2","#ffffff"]][nv];
  const emc=["","#f1e6d2","#3b240f","#2c3340","#4a3200","#073a52"][nv];
  const sc=[0,.66,.74,.82,.91,1][nv];
  const trim=nv===5?"#ffd35a":mats[1];
  let em="";
  if(nv===1)em=`<g fill="none" stroke="${emc}" stroke-width="2"><rect x="-20" y="-14" width="40" height="28" rx="2"/><path d="M-20 -5h40M-20 4h40"/></g><g fill="${emc}"><circle cx="-13" cy="-9.5" r="3"/><circle cx="-6" cy="-9.5" r="3"/><circle cx="7" cy="-0.5" r="3"/><circle cx="14" cy="-0.5" r="3"/><circle cx="-9" cy="8.5" r="3"/><circle cx="0" cy="8.5" r="3"/></g>`;
  if(nv===2)em=`<g fill="none" stroke="${emc}" stroke-width="2"><rect x="-20" y="-14" width="40" height="28" rx="2"/><circle cx="-9" cy="-5" r="5"/><circle cx="9" cy="-5" r="5"/></g><g fill="${emc}"><rect x="-11" y="0" width="4" height="5"/><rect x="7" y="0" width="4" height="5"/><circle cx="0" cy="9" r="3"/></g>`;
  if(nv===3)em=`<g fill="none" stroke="${emc}" stroke-width="2"><rect x="-21" y="-14" width="26" height="20" rx="2"/><rect x="9" y="-12" width="12" height="24" rx="1.5"/></g><g fill="${emc}"><rect x="-17" y="-10" width="18" height="12" opacity=".3"/><rect x="-12" y="8" width="10" height="3"/><rect x="11" y="-8" width="8" height="2"/><circle cx="15" cy="8" r="1.6"/></g>`;
  if(nv>=4){em=`<g fill="none" stroke="${emc}" stroke-width="2"><rect x="-16" y="-15" width="32" height="20" rx="1.8"/></g><path d="M-23 9L23 9L18 5.5L-18 5.5Z" fill="${emc}"/><rect x="-16" y="-15" width="32" height="20" rx="1.8" fill="${emc}" opacity=".16"/>`;
    if(nv===5)em+=`<g fill="${emc}"><circle cx="0" cy="-3.2" r="4.2"/><circle cx="0" cy="-8.2" r="2.7"/></g><path d="M1 -12.2c0-2.2 1.6-3.4 3.4-3.6 0 1.8-1.2 3.4-3.4 3.6z" fill="#3fb27f"/><path d="M0 -11v-2" stroke="${emc}" stroke-width="1"/>`}
  const handles=nv>=2?`<path d="M27 32C9 31 6 60 31 66" fill="none" stroke="${mats[1]}" stroke-width="${nv>=4?7:5.5}" stroke-linecap="round"/><path d="M93 32C111 31 114 60 89 66" fill="none" stroke="${mats[1]}" stroke-width="${nv>=4?7:5.5}" stroke-linecap="round"/>`:"";
  const extra=(nv>=3?`<path d="M60 117l1.8 3.7 4.1.6-3 2.9.7 4.1-3.6-1.9-3.6 1.9.7-4.1-3-2.9 4.1-.6z" fill="${nv>=4?"#ffd35a":"#7c8493"}"/>`:"")+
   (nv>=4?`<g fill="${nv===5?"#ffd35a":mats[1]}" opacity=".95"><ellipse cx="22" cy="86" rx="4" ry="9" transform="rotate(-28 22 86)"/><ellipse cx="30" cy="96" rx="4" ry="9" transform="rotate(-50 30 96)"/><ellipse cx="98" cy="86" rx="4" ry="9" transform="rotate(28 98 86)"/><ellipse cx="90" cy="96" rx="4" ry="9" transform="rotate(50 90 96)"/></g>`:"")+
   (nv===5?`<g fill="#fff"><path d="M12 14l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M108 8l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z"/><path d="M104 48l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" opacity=".8"/></g><path d="M44 13l6 6h20l6-6-6-3-4 4-6-6-6 6-4-4z" fill="#ffd35a" stroke="#c28a12" stroke-width="1"/>`:"");
  const w=Math.round((h||110)*.86*sc),hh=Math.round((h||110)*sc);
  return `<svg viewBox="0 0 120 140" style="width:${w}px;height:${hh}px" role="img" aria-label="Troféu ${TRN[nv]}"><defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${mats[2]}"/><stop offset=".45" stop-color="${mats[0]}"/><stop offset="1" stop-color="${mats[1]}"/></linearGradient></defs>
  ${handles}<rect x="34" y="124" width="52" height="11" rx="3" fill="${nv===5?"#ffd35a":mats[1]}"/><rect x="42" y="113" width="36" height="13" rx="2" fill="url(#${u})"/><rect x="54" y="92" width="12" height="22" fill="url(#${u})"/><ellipse cx="60" cy="93" rx="12" ry="4" fill="${mats[1]}"/>
  <path d="M26 28H94V47C94 75 78 94 60 94C42 94 26 75 26 47Z" fill="url(#${u})" stroke="${trim}" stroke-width="1.4"/><rect x="22" y="21" width="76" height="9" rx="3.5" fill="url(#${u})" stroke="${trim}" stroke-width="1.2"/>
  <path d="M33 33c-2 14 1 28 10 38" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>${extra}<g transform="translate(60 54) scale(${nv===1?.95:1})">${em}</g></svg>`}
function trofeuBox(n,h){const nv=nivel(n);return `<div class="heroT">${trophy(nv,h||112)}<small><b style="color:var(--acc)">${esc(TRN[nv])}</b><br>troféu ${nv} de 5</small></div>`}

/* ---------- diálogos ---------- */
function dialog(o){
  return new Promise(res=>{
    const d=document.createElement("div");d.className="modal";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
    d.innerHTML=`<div class="box" style="max-width:${o.largura||560}px">${o.titulo?`<h2>${esc(o.titulo)}</h2>`:""}<div>${o.html||""}</div>
    ${o.check?`<label style="display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--tx);margin:14px 0 0;cursor:pointer"><input type="checkbox" id="dchk" style="margin-top:3px"><span>${esc(o.check)}</span></label>`:""}
    ${o.texto?`<label for="dtxt">${esc(o.texto)}</label><input type="text" id="dtxt" autocomplete="off">`:""}
    <div class="row" style="margin-top:18px;justify-content:flex-end">${o.semCancelar?"":`<button id="dcn">${esc(o.cancelar||"Cancelar")}</button>`}<button id="dok" class="${o.perigo?"dng":"pri"}">${esc(o.ok||"Confirmar")}</button></div></div>`;
    $("#layer").appendChild(d);
    const ok=$("#dok",d),chk=$("#dchk",d),tx=$("#dtxt",d);
    const need=()=>{ok.disabled=!((!chk||chk.checked)&&(!tx||tx.value.trim().toUpperCase()===(o.exige||"").toUpperCase()))};
    if(chk)chk.onchange=need;if(tx)tx.oninput=need;need();
    const close=v=>{d.remove();document.removeEventListener("keydown",kd);res(v)};
    const kd=e=>{if(e.key==="Escape"&&!o.semCancelar)close(null)};document.addEventListener("keydown",kd);
    ok.onclick=()=>close({texto:tx?tx.value:""});const cn=$("#dcn",d);if(cn)cn.onclick=()=>close(null);
    (tx||ok).focus();
  });
}
function modalHtml(t,h,w){const d=document.createElement("div");d.className="modal";d.setAttribute("role","dialog");d.innerHTML=`<div class="box" style="max-width:${w||820}px"><h2>${esc(t)}</h2>${h}<div style="margin-top:14px;text-align:right"><button class="pri">Fechar</button></div></div>`;d.querySelector("button.pri").onclick=()=>d.remove();$("#layer").appendChild(d);return d}

/* ---------- contexto (máquina, termo, OS) ---------- */
let CTX={t:null},view="home",info={};
async function loadCtx(){try{CTX.t=await api("/api/termo")}catch(e){CTX.t=null}renderChrome()}
const ownT=()=>CTX.t&&CTX.t.status&&CTX.t.status.dono==="terceiros";
function renderChrome(){
  const t=CTX.t,st=t&&t.status;
  const items=[["home","Home","home"],["backup","Backup","backup"],["mapas","Mapas","mapa"],["dados","Dados","dados"],["maq","Máquinas","maq"],["os","OS","os"]];
  const need=ownT()&&!t.os;
  $("#gaveta").innerHTML=items.map(i=>`<button class="gv ${view===i[0]?"on":""}" data-view="${i[0]}" title="${i[1]}"><span class="ic">${ic(i[2])}</span><span class="lb">${i[1]}</span>${i[0]==="os"&&need?'<span class="bd">falta</span>':""}</button>`).join("")+
   `<span class="sp"></span><div class="gvfoot"><b>${esc(t?t.nome:info.host||"")}</b><button class="mid" id="midc" title="Copiar o código da máquina">${esc(t?t.mid:"")}</button></div><button class="gv" id="gvtoggle" title="Recolher"><span class="ic">☰</span><span class="lb">Recolher</span></button>`;
  $$("#gaveta [data-view]").forEach(b=>b.onclick=()=>nav(b.dataset.view));
  $("#gvtoggle").onclick=()=>document.body.classList.toggle("min");
  const mc=$("#midc");if(mc)mc.onclick=()=>{try{navigator.clipboard.writeText(t.mid);toast("Código copiado: "+t.mid,"ok")}catch(e){}};
  $("#hown").innerHTML=st&&st.aceito?(st.dono==="terceiros"?`<span class="chip own-t" title="Máquina de terceiros"><i class="d"></i>Terceiros${st.terceiro_nome?": "+esc(st.terceiro_nome):""}</span>`:`<span class="chip own-p" title="Máquina particular"><i class="d"></i>Particular</span>`):"";
  if(info.simulacao)$("#hown").innerHTML+=`<span class="chip own-t" title="Reproduzindo uma coleta salva: as ações são só simuladas, nada muda neste computador"><i class="d"></i>SIMULAÇÃO</span>`;
  $("#hver").textContent="v"+(info.versao||"–");
  srvChip();
}
/* modo servidor: quem está conectado, o que falta enviar e o botão de encerrar (apaga tudo deste computador) */
function srvChip(){
  const sv=info.servidor,el=$("#hsrv");if(!el)return;
  if(!sv){el.innerHTML="";return}
  $("#hver").title="No modo servidor o programa já vem atualizado";
  el.innerHTML=`<span class="chip ${sv.pendentes?"own-t":"own-p"}" title="Fichas, históricos e termos ficam no servidor ${esc(sv.url)}"><i class="d"></i>Servidor${sv.tecnico?" · "+esc(sv.tecnico):""}${sv.pendentes?` · ${sv.pendentes} pendente(s)`:""}</span><button class="chip" id="henc" title="Envia o que falta, apaga os arquivos deste computador e fecha o programa">Encerrar</button>`;
  $("#henc").onclick=()=>safe(encerrar);
}
async function encerrar(descartar){
  if(!descartar&&!await dialog({titulo:"Encerrar o Destrava!?",html:"<p>O que falta é enviado ao servidor e os arquivos temporários são apagados deste computador. Depois, pode fechar esta aba.</p>",ok:"Encerrar"}))return;
  const r=await api("/api/encerrar",{descartar:!!descartar});
  if(!r.ok){
    if(await dialog({titulo:"Sem conexão com o servidor",html:`<p><b>${r.pendentes} alteração(ões)</b> ainda não chegaram ao servidor. Se encerrar agora, elas se perdem.</p><p>Verifique a internet e tente de novo, ou encerre mesmo assim.</p>`,ok:"Encerrar e perder",perigo:true}))return encerrar(true);
    return;
  }
  document.body.innerHTML='<p style="padding:30px;font:16px system-ui">Destrava! encerrado. Os arquivos temporários foram apagados deste computador. Pode fechar esta aba.</p>';
}
setInterval(async()=>{if(!info.servidor)return;try{const i=await api("/api/info");if(i.servidor){info.servidor=i.servidor;srvChip()}}catch(e){}},20000);
function markNav(){$$("#gaveta [data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===view))}
function setWide(b){$("#main").classList.toggle("wide",!!b)}

    <label class="cat" style="margin:0;cursor:pointer;color:var(--tx);font-size:14px"><input type="radio" name="dono" value="terceiros" ${corp?"checked":""}><div class="n"><b>De terceiros</b><span>Cliente, empresa ou outra pessoa.</span></div></label></div>

/* ---------- permissões na entrada ---------- */
async function openPerm(primeira){
  const p=await api("/api/permissoes");
  const d=document.createElement("div");d.className="modal";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  const linha=(ok,t,s)=>`<li style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)"><span class="ci" style="${ok?"background:var(--ok);border-color:var(--ok);color:#fff":"border-color:var(--warn);color:var(--warn)"}">${ok?"✓":"!"}</span><div><b>${t}</b><div class="mut" style="font-size:13px;margin-top:2px">${s}</div></div></li>`;
  let corpo="";
  if(p.mac)corpo=linha(p.acesso_total,"Acesso Total ao Disco","Sem ele o macOS esconde algumas pastas (Mail, Safari, parte de Library) e a varredura enxerga menos. A permissão é do app que roda o Destrava!: o <b>Terminal</b>.")+
    (p.acesso_total?"":`<div class="infobox" style="font-size:13px"><b>Como liberar</b><ol style="margin:6px 0 0;padding-left:20px"><li>Clique em <b>Abrir Ajustes</b>.</li><li>Em <i>Privacidade e Segurança → Acesso Total ao Disco</i>, ligue o <b>Terminal</b> (ou clique em + e adicione).</li><li>Feche o Terminal, abra o Destrava! de novo e clique em <b>Verificar de novo</b>.</li></ol></div>`);
  else if(p.win)corpo=linha(p.admin,"Executar como administrador",p.admin?"Tudo certo: leitura de slots de RAM e saúde do disco liberada.":"Sem isso, slots de RAM e saúde do disco ficam sem leitura. Abra pelo <b>Iniciar-Windows.bat</b>, que pede a permissão.");
  else corpo=linha(p.root,"Permissão de administrador (sudo)",p.root?"Tudo certo: leitura de slots de RAM e saúde do disco liberada.":"Sem isso, slots de RAM e saúde do disco ficam sem leitura. Abra o Destrava! com <b>sudo</b>.");
  const falta=p.mac?!p.acesso_total:p.win?!p.admin:!p.root;
  d.innerHTML=`<div class="box" style="max-width:600px"><h2>${primeira?"Termo aceito. Só mais um passo":"Permissões"}</h2>
   <p class="mut" style="margin:0 0 4px">Estas permissões são opcionais. Sem elas o programa funciona, só enxerga um pouco menos.</p><ul class="chkl" style="margin:0">${corpo}</ul>
   ${primeira?`<p style="margin:12px 0 0"><button class="sm" id="pdoc">Abrir cópia do termo para imprimir ou salvar em PDF</button></p>`:""}
   <div class="row" style="margin-top:16px;justify-content:flex-end">${p.mac&&falta?'<button id="pab">Abrir Ajustes</button>':""}<button id="pvf">Verificar de novo</button><button class="pri" id="pok">${falta?"Continuar assim mesmo":"Continuar"}</button></div></div>`;
  $("#layer").appendChild(d);
  const ab=$("#pab",d);if(ab)ab.onclick=()=>safe(()=>api("/api/permissoes/abrir",{}));
  $("#pvf",d).onclick=()=>{d.remove();openPerm(primeira)};
  $("#pok",d).onclick=()=>{d.remove();if(view==="home")drawHome()};
  const pd=$("#pdoc",d);if(pd)pd.onclick=()=>safe(()=>api("/api/doc/abrir",{tipo:"termo"}));
}

/* ---------- atualizador ---------- */
async function openUpdate(){
  const r=await api("/api/atualizar/procurar");
  const d=document.createElement("div");d.className="modal";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  const nova=r.encontrados.filter(x=>x.mais_nova);
  d.innerHTML=`<div class="box" style="max-width:640px"><h2>Atualizar o Destrava!</h2>
   <p class="mut" style="margin:0 0 8px">Você está na versão <b style="color:var(--tx)">${esc(r.versao)}</b>. A atualização troca <b>só o programa</b>. Suas fichas, históricos, termos, OS e o registro de consentimentos <b>não são tocados</b>, e a versão atual fica guardada para você voltar.</p>
   <div id="uA">${nova.length?nova.map(x=>`<div class="okbox"><b>Versão ${esc(x.versao)} encontrada</b><div class="mono mut" style="margin:4px 0 8px;word-break:break-all">${esc(x.caminho)} · ${esc(x.quando)}</div><button class="pri" data-up="${esc(x.caminho)}">Atualizar agora</button></div>`).join(""):'<div class="infobox">Nenhuma versão mais nova encontrada em Downloads, Área de Trabalho ou no pendrive.</div>'}</div>
   ${r.encontrados.filter(x=>!x.mais_nova).length?`<p class="mut" style="font-size:12.5px;margin:8px 0 2px">Outros arquivos encontrados: ${r.encontrados.filter(x=>!x.mais_nova).map(x=>`${esc(x.nome)} (v${esc(x.versao)}${x.igual?", igual à atual":""}) <button class="sm" data-up="${esc(x.caminho)}">usar</button>`).join(" · ")}</p>`:""}
   <h3 style="margin-top:14px">Escolher o arquivo manualmente</h3>
   <p class="mut" style="font-size:12.5px;margin:0 0 6px">Baixe o <b>Destrava.zip</b> novo e selecione aqui. Não precisa descompactar nem apagar nada.</p>
   <input type="file" id="uf" accept=".zip"><div id="uB" style="margin-top:8px"></div>
   ${r.salvas.length?`<h3 style="margin-top:16px">Voltar para uma versão anterior</h3>${r.salvas.map(x=>`<div class="row" style="margin:4px 0"><span class="grow">Versão ${esc(x.versao)} <span class="mut mono">${esc(x.nome)}</span></span><button class="sm" data-rv="${esc(x.nome)}">Voltar para esta</button></div>`).join("")}`:""}
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button id="ucl">Fechar</button></div></div>`;
  $("#layer").appendChild(d);
  $("#ucl",d).onclick=()=>d.remove();
  const aplicar=async(cam)=>{
    $("#uB",d).innerHTML='<div class="infobox">Atualizando… não feche esta janela.</div>';
    try{const x=await api("/api/atualizar/aplicar",{caminho:cam});
      d.querySelector(".box").innerHTML=`<h2>Atualizado: v${esc(x.de)} → v${esc(x.para)}</h2><div class="okbox">${x.trocados} arquivo(s) do programa trocados. <b>Seus registros foram mantidos.</b> A versão anterior ficou guardada.${x.config_nova.length?`<br><span class="mut">Você tinha editado ${esc(x.config_nova.join(", "))}: a versão nova ficou ao lado como .novo.txt, sem sobrescrever a sua.</span>`:""}</div>
       <p class="mut" style="font-size:12px;word-break:break-all">Selo do arquivo (SHA-256): ${esc(x.zip_sha256)}</p><div class="row" style="justify-content:flex-end"><button class="pri" id="urs">Reiniciar agora</button></div>`;
      $("#urs",d).onclick=async()=>{await api("/api/atualizar/reiniciar",{}).catch(()=>{});document.body.innerHTML='<div style="max-width:520px;margin:18vh auto;padding:24px;text-align:center;font:16px system-ui"><h2>Reiniciando com a versão nova…</h2><p>Uma nova janela do Destrava! abre em instantes. Pode fechar esta aba.</p></div>'};
    }catch(e){$("#uB",d).innerHTML=`<div class="errbox">${esc(e.message)}</div>`}
  };
  $$("[data-up]",d).forEach(b=>b.onclick=()=>aplicar(b.dataset.up));
  $$("[data-rv]",d).forEach(b=>b.onclick=async()=>{if(!await dialog({titulo:"Voltar de versão?",html:"<p>O programa volta para a versão escolhida. Seus registros continuam intactos.</p>",ok:"Voltar"}))return;
    try{const x=await api("/api/atualizar/reverter",{nome:b.dataset.rv});d.querySelector(".box").innerHTML=`<h2>Versão restaurada: v${esc(x.para)}</h2><p class="mut">Reinicie para usar a versão restaurada.</p><div class="row" style="justify-content:flex-end"><button class="pri" id="urs">Reiniciar agora</button></div>`;
      $("#urs",d).onclick=async()=>{await api("/api/atualizar/reiniciar",{}).catch(()=>{});document.body.innerHTML='<div style="max-width:520px;margin:18vh auto;padding:24px;text-align:center;font:16px system-ui"><h2>Reiniciando…</h2><p>Uma nova janela abre em instantes. Pode fechar esta aba.</p></div>'}}catch(e){toast(e.message,"err")}});
  $("#uf",d).onchange=async e=>{const f=e.target.files[0];if(!f)return;$("#uB",d).innerHTML='<div class="infobox">Lendo o arquivo…</div>';
    try{const res=await fetch("/api/atualizar/enviar?nome="+encodeURIComponent(f.name),{method:"POST",headers:{"X-DD-Token":TOKEN},body:f});const j=await res.json();if(!res.ok)throw new Error(j.erro);
      $("#uB",d).innerHTML=`<div class="okbox"><b>Zip válido: versão ${esc(j.versao)}</b> (${j.arquivos} arquivos)<div class="mono mut" style="margin:4px 0 8px;word-break:break-all">SHA-256: ${esc(j.sha256)}</div><button class="pri" id="uGo">Atualizar para v${esc(j.versao)}</button></div>`;
      $("#uGo",d).onclick=()=>aplicar(j.caminho)}catch(x){$("#uB",d).innerHTML=`<div class="errbox">${esc(x.message)}</div>`}};
}
async function checkUpdate(){if(info.servidor)return;try{const r=await api("/api/atualizar/procurar");if(r.encontrados.some(x=>x.mais_nova))$("#hver").classList.add("nova")}catch(e){}}

/* ================= Home / ficha ================= */
let hp=null;
function nav(v,arg){
  view=v;markNav();renderChrome();clearInterval(hp);
  $("#steps").classList.toggle("hide",v!=="backup");
  if(v==="home")drawHome();else if(v==="maq")drawMaq(arg);else if(v==="dados")drawDados();else if(v==="mapas")drawMapas();else if(v==="os")drawOS();else{setWide(false);renderSteps();draw()}
}
async function drawHome(){
  clearInterval(hp);setWide(true);
  const est=await api("/api/ficha/estado");
  if(est.rodando)return drawFichaProg();
  const r=await api("/api/ficha/atual");
  if(view!=="home")return;
  if(!r.visao)return drawHomeVazia(r,est);
  renderFicha(r,true);
}

const ICONS_CHAR={cpu:"cpu",ram:"ram",disco:"disk",gpu:"gpu",sys:"sys",bat:"bat"};
function chCard(k,ico,valor,det,item){return `<div class="ch"><div class="ico">${ic(ico)}</div><div class="k">${esc(k)}</div><div class="v">${esc(valor)}</div><div class="d">${esc(det||"")}</div>${item?`<div class="m"><b style="color:${COR(item.nota)}">${item.nota}</b><div class="mini"><i style="width:${item.nota}%;background:${COR(item.nota)}"></i></div></div>`:""}</div>`}
function dtxt(d,ruido){if(d==null)return '<span class="delta eq">—</span>';if(Math.abs(d)<=(ruido==null?0:ruido))return '<span class="delta eq">＝ estável</span>';return d>0?`<span class="delta up">▲ +${d}</span>`:`<span class="delta dn">▼ ${d}</span>`}
function sparkline(f){
  if(!f.length)return"";const W=348,H=54,p=8,xs=i=>f.length===1?W/2:p+i*(W-2*p)/(f.length-1),ys=n=>H-p-(n/100)*(H-2*p);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Notas ao longo do tempo"><polyline points="${f.map((x,i)=>xs(i)+","+ys(x.nota)).join(" ")}" fill="none" stroke="var(--line)" stroke-width="2"/>${f.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x.nota)}" r="4.5" fill="${COR(x.nota)}"><title>${x.nota} em ${esc(x.quando)}</title></circle>`).join("")}</svg>`}
function drawerHtml(v){
  const f=v.fichas||[],byA={};f.forEach(x=>byA[x.arquivo]=x);
  const min=new Set(f.map(x=>(x.quando||"").slice(0,16)));
  const evs=[];
  f.forEach((x,i)=>evs.push({q:x.quando,ficha:x,prev:i?f[i-1]:null}));
  (v.historico||[]).forEach(e=>{if(e.extra&&e.extra.arquivo&&byA[e.extra.arquivo])return;if((e.tipo==="ficha"||e.tipo==="ficha_depois")&&min.has((e.quando||"").slice(0,16)))return;evs.push({q:e.quando,e})});
  evs.sort((a,b)=>(b.q||"").localeCompare(a.q||""));
  return `<div class="in"><div class="row"><h3 style="font-size:16px;margin:0" class="grow">Histórico desta máquina</h3><button class="sm" id="drx" aria-label="Fechar histórico">Fechar ✕</button></div>
   <p class="mut" style="font-size:12.5px;margin:4px 0 8px">${f.length} análise(s). Marque duas para comparar.</p>${sparkline(f)}
   <div class="row" style="margin:8px 0 12px"><button class="sm pri" id="cmpsel" disabled>Comparar as 2 marcadas</button>${f.length>1?'<button class="sm" id="cmplast">Comparar as 2 últimas</button>':""}</div>
   <div class="tl">${evs.map(o=>o.ficha?`<div class="ev fi"><label><input type="checkbox" class="fck" data-a="${esc(o.ficha.arquivo)}"><span><span class="nt" style="color:${COR(o.ficha.nota)};border-color:${COR(o.ficha.nota)}">${o.ficha.nota}</span><b>${o.ficha.fase==="depois"?"Depois das melhorias":"Análise"}</b> ${o.prev?dtxt(o.ficha.nota-o.prev.nota,2):""}<br><small>${esc(o.ficha.quando)} · ${esc(o.ficha.classe)}${o.ficha.cobertura<100?" · "+o.ficha.cobertura+"% dos critérios":""}</small></span></label></div>`:`<div class="ev"><b>${esc(o.e.resumo)}</b><br><small>${esc(o.e.quando)} · ${esc(o.e.tipo)}</small></div>`).join("")||'<span class="mut">Sem eventos.</span>'}</div>
   <div class="row" style="margin-top:8px"><button class="sm" id="note">Anotar no histórico</button></div></div>`;
}

function linhaMapa(x){

   <div class="row" style="gap:6px;margin-top:6px">${x.previa?`<button class="sm" data-mv="${x.i}" data-tp="${esc(x.previa)}" data-nm="${esc(x.nome)}">👁 Ver</button>`:""}${x.pode_abrir?`<button class="sm" data-ma="${x.i}">Abrir</button>`:""}${x.no_backup?`<button class="sm gh" data-mpa="${x.i}">Mostrar na pasta</button>`:x.situacao==="ok"?'<span class="mut" style="font-size:12px">o disco do backup não está conectado</span>':""}</div></div><div class="sz">${fmt(x.bytes)}${x.data?`<div class="mut" style="font-size:11px;font-weight:400;text-align:right">${esc(x.data)}</div>`:""}</div></div>`;

function ligarMapa(el){

function verArquivoMapa(i,tipo,nome){
  const url="/api/mapa/ver?i="+i+"&t="+encodeURIComponent(TOKEN);
  if(tipo==="pdf"){window.open(url,"_blank","noopener");return}
  const sty="max-width:100%;max-height:70vh;display:block;margin:auto";
  const corpo=tipo==="imagem"?`<img src="${url}" alt="${esc(nome)}" style="${sty}">`:tipo==="video"?`<video src="${url}" controls autoplay style="${sty}"></video>`:tipo==="audio"?`<audio src="${url}" controls autoplay style="width:100%"></audio>`:'<pre class="mono" id="vtx" style="max-height:65vh;overflow:auto;white-space:pre-wrap;font-size:12.5px;margin:0">Carregando…</pre>';
  const d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="box" style="max-width:900px;width:calc(100% - 32px)"><div class="row"><h2 class="grow" style="margin:0;font-size:16px;word-break:break-all">${esc(nome)} <span class="mut" style="font-size:12px">(do backup)</span></h2><button class="sm" id="vx">Fechar ✕</button></div><div style="margin:12px 0">${corpo}</div></div>`;
  $("#layer").appendChild(d);
  const tecla=ev=>{if(ev.key==="Escape")fechar()};
  const fechar=()=>{const m=$("video,audio",d);if(m)m.pause();d.remove();document.removeEventListener("keydown",tecla)};
  document.addEventListener("keydown",tecla);$("#vx",d).onclick=fechar;d.onclick=ev=>{if(ev.target===d)fechar()};
  if(tipo==="texto")fetch(url).then(r=>r.ok?r.text():Promise.reject()).then(t=>{$("#vtx",d).textContent=t}).catch(()=>{$("#vtx",d).textContent="Não consegui ler este arquivo."});
}

async function conferindo(soSeRodando){
  const s=await api("/api/mapa/conferencia");const el=$("#mpcf");if(!el||view!=="mapas")return;
  if(!s.total&&soSeRodando)return;
  const pct=s.total?Math.round(s.feitos*100/s.total):0;
  el.innerHTML=s.rodando?`<div class="infobox">Conferindo (${esc(s.metodo||"")}): ${nf(s.feitos)} de ${nf(s.total)} (${pct}%)…</div>`
    :s.fim?(s.n_diferentes||s.n_faltando?`<div class="warnbox"><b>Atenção:</b> ${s.n_diferentes} arquivo(s) diferente(s) do original e ${s.n_faltando} faltando no backup.${(s.diferentes.concat(s.faltando)).slice(0,10).map(x=>`<div class="mono" style="font-size:12px">${esc(x)}</div>`).join("")}</div>`
      :`<div class="okbox">Tudo confere: ${nf(s.ok)} arquivo(s) relidos (${esc(s.metodo||"")}) e iguais ao original.</div>`):"";
  if(s.rodando)MP.T=setTimeout(()=>conferindo(),1000);
}

function renderFicha(r,atual){

function wireFicha(r,atual,v,mid){
  const setDr=o=>{lsSet("dd_drawer",o?"1":"0");const dr=$("#dr");dr.classList.toggle("open",o);const b=$("#hbtn");b.classList.toggle("pri",o);b.textContent="Histórico "+(o?"◂":"▸")};
  $("#hbtn").onclick=()=>setDr(!$("#dr").classList.contains("open"));
  const dx=$("#drx");if(dx)dx.onclick=()=>setDr(false);
  const ag=$("#again");if(ag)ag.onclick=()=>safe(async()=>{await api("/api/ficha/coletar",{fase:"antes"});if(view==="maq")nav("home");else drawFichaProg()});
  const cb=$("#cmp");if(cb)cb.onclick=()=>openCompare(mid);
  const cl=$("#cmplast");if(cl)cl.onclick=()=>openCompare(mid);
  const sync=()=>{const c=$$(".fck:checked");$("#cmpsel").disabled=c.length!==2;$$(".fck").forEach(x=>x.disabled=c.length>=2&&!x.checked)};
  $$(".fck").forEach(c=>c.onchange=sync);
  const cs=$("#cmpsel");if(cs)cs.onclick=()=>{const c=$$(".fck:checked").map(x=>x.dataset.a).sort();openCompare(mid,c[0],c[1])};
  $("#note").onclick=async()=>{const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box" style="max-width:480px"><h2>Anotar no histórico</h2><label for="ntx">O que anotar? (ex.: Entregue ao cliente, formatada com Zorin Lite)</label><input type="text" id="ntx"><div class="row" style="margin-top:16px;justify-content:flex-end"><button id="nc">Cancelar</button><button class="pri" id="nk">Anotar</button></div></div>`;$("#layer").appendChild(d);$("#ntx",d).focus();$("#nc",d).onclick=()=>d.remove();$("#nk",d).onclick=()=>safe(async()=>{const t=$("#ntx",d).value.trim();if(!t)return;await api("/api/hist",{tipo:"nota",resumo:t});d.remove();view==="maq"?drawMaq(mid):drawHome()})};
  const cp=()=>{try{navigator.clipboard.writeText(mid);toast("Código copiado: "+mid,"ok")}catch(e){}};$("#mid2").onclick=cp;
  const ex=$("#exp");if(ex)ex.onclick=()=>safe(async()=>{const x=await api("/api/ficha/exportar",{});toast("Coleta gravada: "+x.arquivo,"ok")});
  $("#ren").onclick=()=>{const h2=$("#tt");const i=document.createElement("input");i.type="text";i.value=v.meta&&v.meta.nome||v.nome;i.setAttribute("aria-label","Nome da máquina");h2.replaceWith(i);$("#ren").classList.add("hide");i.focus();i.select();
    const save=()=>safe(async()=>{await api("/api/maquina/nome",{mid,nome:i.value});await loadCtx();view==="maq"?drawMaq(mid):drawHome()});
    i.onkeydown=e=>{if(e.key==="Enter")save();if(e.key==="Escape")view==="maq"?drawMaq(mid):drawHome()};i.onblur=save};
  const apb=$("#apply");if(apb)apb.onclick=()=>safe(async()=>{
    const ids=$$(".ck:checked").map(c=>c.dataset.id);if(!ids.length){toast("Marque pelo menos uma melhoria.");return}
    const S={};(v.analise.otimizacoes||[]).forEach(s=>S[s.id]=s);const sv=ids.filter(i=>S[i]&&S[i].reversivel===false);
    if(!await dialog({titulo:"Aplicar "+ids.length+" otimização(ões)?",html:`<ul style="margin:0;padding-left:18px;font-size:13.5px">${ids.map(i=>`<li>${esc(S[i]?S[i].titulo:i)}${S[i]&&S[i].onus?` <span class="mut">⚠ ${esc(S[i].onus)}</span>`:""}</li>`).join("")}</ul>${sv.length?`<p style="margin-top:8px"><b>${sv.length}</b> não tem volta (marcado como “sem volta”).</p>`:""}<p class="mut" style="margin-top:8px">Depois o programa mede de novo para mostrar o antes e depois.</p>`,ok:"Aplicar"}))return;
    await api("/api/ficha/aplicar",{ids,confirmo:true});nav("home")});
  const ud=$("#undo");if(ud)ud.onclick=()=>safe(async()=>{if(!await dialog({titulo:"Desfazer as melhorias?",html:"<p>Os ajustes aplicados voltam como estavam.</p>",ok:"Desfazer"}))return;const x=await api("/api/ficha/desfazer",{});toast(x.desfeitos+" ajuste(s) desfeito(s). Analise de novo para atualizar a nota.","ok");drawHome()});
  $("#wipe").onclick=()=>safe(async()=>{const r2=await dialog({titulo:"Remover esta máquina do pendrive?",html:`<p>Fichas, históricos e documentos de <b>${esc(v.nome)}</b> serão apagados do pendrive. Isso não tem volta.</p>`,texto:"Digite APAGAR para confirmar",exige:"APAGAR",ok:"Remover",perigo:true});if(!r2)return;
    await api("/api/maquina/apagar",{mid,digitou:r2.texto});await loadCtx();toast("Dados removidos do pendrive.","ok");nav("maq")});
}

/* ---------- comparar (Versus) ---------- */
async function openCompare(mid,a,b){
  const L=await api("/api/ficha/lista?mid="+encodeURIComponent(mid));const f=L.fichas;
  if(f.length<2)return toast("Precisa de pelo menos duas análises para comparar.");
  a=a||f[f.length-2].arquivo;b=b||f[f.length-1].arquivo;
  const d=document.createElement("div");d.className="modal";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
  const opt=s=>f.map(x=>`<option value="${esc(x.arquivo)}" ${x.arquivo===s?"selected":""}>${esc(x.quando)} · nota ${x.nota} · ${x.fase==="depois"?"depois das melhorias":"análise"}</option>`).join("");
  d.innerHTML=`<div class="box" style="max-width:860px"><div class="row"><h2 class="grow" style="margin:0">Comparar análises</h2><button class="sm" id="cx">Fechar ✕</button></div>
   <div class="row" style="margin:12px 0"><div class="grow"><label for="ca">Antes (referência)</label><select id="ca">${opt(a)}</select></div><div class="grow"><label for="cb">Depois (comparada)</label><select id="cb">${opt(b)}</select></div></div><div id="cbody"></div></div>`;
  $("#layer").appendChild(d);$("#cx",d).onclick=()=>d.remove();
  const go=async()=>{
    const A=$("#ca",d).value,B=$("#cb",d).value;
    if(A===B){$("#cbody",d).innerHTML='<div class="infobox">Escolha duas análises diferentes.</div>';return}
    try{const c=await api("/api/ficha/comparar?mid="+encodeURIComponent(mid)+"&a="+encodeURIComponent(A)+"&b="+encodeURIComponent(B));
      const sub=nivel(c.b.nota)>nivel(c.a.nota),desc=nivel(c.b.nota)<nivel(c.a.nota);
      $("#cbody",d).innerHTML=`<div class="card" style="box-shadow:none;text-align:center"><div class="row" style="justify-content:center;gap:28px"><div><div class="mut" style="font-size:12px">ANTES · ${esc(c.a.quando)}</div><b style="font-size:34px;color:${COR(c.a.nota)}">${c.a.nota}</b><div class="mut">${esc(c.a.classe)}</div></div>
       <div style="width:220px">${speedo(c.b.nota,{ghost:c.a.nota,label:"Comparação"})}<div style="margin-top:-4px;font-size:20px;font-weight:800">${c.delta===0?'<span class="delta eq">＝ mesma nota</span>':c.delta>0?`<span class="delta up">▲ +${c.delta} pontos</span>`:`<span class="delta dn">▼ ${c.delta} pontos</span>`}</div></div>
       <div><div class="mut" style="font-size:12px">DEPOIS · ${esc(c.b.quando)}</div><b style="font-size:34px;color:${COR(c.b.nota)}">${c.b.nota}</b><div class="mut">${esc(c.b.classe)}</div></div></div>
       ${sub||desc?`<p style="margin:10px 0 0;font-weight:700;color:${sub?"var(--ok)":"var(--err)"}">${sub?"Subiu":"Desceu"} de troféu: ${esc(TRN[nivel(c.a.nota)])} → ${esc(TRN[nivel(c.b.nota)])}</p>`:""}</div>
       ${c.nada_mudou?'<div class="okbox"><b>Nada mudou</b> entre essas duas análises: mesma nota, mesmos indicadores e mesma configuração.</div>':""}

function ringP(p,txt,sub){const r=70,c=2*Math.PI*r;return `<div class="ringp"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rgc" cx="85" cy="85" r="${r}" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 85 85)" style="transition:stroke-dashoffset .5s"/></svg><div class="n"><b id="rgt">${txt}</b><span id="rgs">${sub||""}</span></div></div>`}
function setRing(p,txt,sub){const c=2*Math.PI*70,e=$("#rgc");if(!e)return;e.setAttribute("stroke-dashoffset",c*(1-Math.min(100,p)/100));$("#rgt").textContent=txt;$("#rgs").textContent=sub||""}

  if(!f.length&&!nsw)h+=`<div class="rc g"><span class="ic2">✅</span><div><b>Tudo conferido.</b><div class="mut">Nenhuma falha, e a varredura final não encontrou diferenças.</div></div></div>`;
  if(f.length)h+=`<div class="rc r"><span class="ic2">⛔</span><div class="grow"><b>${nf(st.n_failures)} arquivo(s) com problema</b><div class="mut">Cada um mostra o motivo e como resolver.</div></div></div>
   <div class="card"><table><tr><th>Arquivo</th><th>Por quê</th><th>Como resolver</th></tr>${f.map(x=>`<tr><td class="mono">${esc(x.disp)}<br><span class="mut">${fmt(x.size)}</span></td><td>${esc(x.err)}</td><td>${esc(FIX[x.cause]||FIX.outro)}</td></tr>`).join("")}</table><div class="row" style="margin-top:10px"><button class="pri" id="retry">Refazer só os que falharam</button></div></div>`;
  if(nsw){h+=`<div class="rc y"><span class="ic2">⚠️</span><div><b>Varredura final</b><div class="mut">${nf(sw.n_novos)} novo(s), ${nf(sw.n_alterados)} alterado(s) e ${nf(sw.n_sumiram)} que sumiram da origem desde o escaneamento.</div></div></div>`;
    const rows=[...(sw.novos||[]).map(x=>[x,"Novo"]),...(sw.alterados||[]).map(x=>[x,"Alterado"])];
    if(rows.length)h+=`<div class="card"><table><tr><th>Arquivo</th><th>Situação</th></tr>${rows.slice(0,80).map(r=>`<tr><td class="mono">${esc(r[0][0])}</td><td>${r[1]}: ${esc(r[0][2])}</td></tr>`).join("")}</table>${sw.n_novos?'<p class="mut">Para incluir os novos, volte ao passo 2 e escaneie de novo (o que já foi copiado é reaproveitado).</p>':""}</div>`}
  h+=`<div class="row"><span class="grow"></span><button class="pri" id="fin">Concluir e gerar certificado →</button></div>`;
  $("#res5").innerHTML=h;
  const r=$("#retry");if(r)r.onclick=()=>safe(async()=>{await api("/api/retry",{});go(3)});
  $("#fin").onclick=()=>safe(async()=>{await api("/api/finish",{});go(5)});
}

/* ---- 6 conclusão ---- */
async function draw6(){
  setWide(false);st=await api("/api/status");const c=st.cert;
  if(!c){$("#main").innerHTML=`<div class="card">Gere o certificado no passo anterior.</div>`;return}
  const ok=c.status==="sem_falhas",g=await api("/api/firmware_gate",{}),terc=ownT();
  const rec=c.recuperado_bytes?`<div class="kpi"><div class="mut">Espaço recuperado (Dados)</div><div class="big">${fmt(c.recuperado_bytes)}</div></div>`:"";
  $("#main").innerHTML=`<div class="card"><div class="row" style="gap:18px"><div class="seal">${DD.seal({variant:"ouro",bottom:"flat",bottomText:ok?"BACKUP VERIFICADO":"COM RESSALVAS",size:92})}</div>
   <div class="grow"><h2 style="font-size:22px">${ok?"Backup concluído. Do jeito D&amp;D.":"Backup concluído com ressalvas, e a gente mostra cada uma."}</h2><p class="h">Código ${esc(c.codigo)} · ${esc(c.metodo)}${c.maquina_nome?" · "+esc(c.maquina_nome):""}</p></div></div>
   <div class="grid"><div class="kpi"><div class="mut">Copiados e conferidos</div><div class="big">${nf(c.copiados)}</div></div><div class="kpi"><div class="mut">Tamanho</div><div class="big">${fmt(c.bytes)}</div></div><div class="kpi"><div class="mut">Falhas</div><div class="big">${c.falhas}</div></div><div class="kpi"><div class="mut">Ficaram de fora (listados)</div><div class="big">${nf(c.ficaram)}</div></div>${rec}</div>
   ${c.motivos.length?`<h3 style="font-size:14px">O que ficou de fora e por quê</h3><table>${c.motivos.map(x=>`<tr><td>${esc(x.motivo)}</td><td>${nf(x.n)}</td><td>${fmt(x.bytes)}</td></tr>`).join("")}</table>`:""}
   <p class="mono mut">Pasta do backup: ${esc(st.dest_root)}<br>Mapa: ${esc(st.dest_root)}/Mapa/visualizador.html</p>
   <div class="row"><button class="pri" id="omi">Abrir o Mapa no Destrava!</button><button id="om">Visualizador offline</button><button id="newb">Novo backup</button>${terc?'<button id="os6">Encerrar a OS</button>':""}</div></div>
  <div class="card"><h2>Formatar a máquina</h2>${g.ok?`<p class="h">Tudo certo para seguir. O computador reinicia direto na tela de firmware (BIOS/UEFI) para você escolher o boot e formatar.</p>
   <label style="display:flex;gap:8px;align-items:center;margin:0 0 12px;color:var(--tx)"><input type="checkbox" id="cf"> Confirmo que o backup foi conferido e que posso formatar.</label><button class="dng" id="fw" disabled>Reiniciar para a BIOS/UEFI</button>`:`<div class="warnbox">Formatação bloqueada: ${esc(g.motivo)}</div>`}</div>`;
  $("#om").onclick=()=>safe(()=>api("/api/open_mapa",{}));
  const omi=$("#omi");if(omi)omi.onclick=()=>safe(async()=>{await api("/api/mapa/abrir",{pasta:st.dest_root});nav("mapas")});
  $("#newb").onclick=()=>safe(async()=>{await api("/api/reset",{});S.sources=[];S.chosen={};S.dest="";S.folder="";go(0)});
  const o6=$("#os6");if(o6)o6.onclick=()=>nav("os");
  const cf=$("#cf");if(cf){cf.onchange=()=>$("#fw").disabled=!cf.checked;
   $("#fw").onclick=()=>safe(async()=>{
    const x=await dialog({titulo:"Último aviso",html:"<p>O computador vai reiniciar em instantes para a tela de firmware.</p>"+(terc?'<div class="warnbox">Máquina de terceiros: confirme que o cliente autorizou a formatação.</div>':""),texto:terc?"Digite FORMATAR para confirmar":null,exige:terc?"FORMATAR":null,ok:"Reiniciar agora",perigo:true});
    if(!x)return;const r=await api("/api/firmware",{confirmo:true,digitou:x.texto||""});toast(r.simulado?"(Teste) reinício simulado.":"Reiniciando para a BIOS/UEFI em alguns segundos…","ok")})}
}

/* ================= início ================= */
(async()=>{
  const th=lsGet("dd_tema","");if(th)document.documentElement.dataset.theme=th;
  $("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";lsSet("dd_tema",r.dataset.theme)};
  try{$("#mono").innerHTML='<span class="mA">'+DD.mono({variant:"ouro",size:44,bg:true})+'</span><span class="mB">'+DD.mono({variant:"claro",size:44,bg:false})+'</span>'}catch(e){}
  try{info=await api("/api/info")}catch(e){document.body.innerHTML='<p style="padding:30px">Sessão inválida. Feche e abra o Destrava! de novo.</p>';return}
  FB=/darwin|mac/i.test(info.os||"")?1000:1024;
  $("#hver").onclick=()=>{if(info.servidor){toast("No modo servidor o programa já vem na versão do servidor.");return}safe(openUpdate)};
  await loadCtx();
  let s;try{s=await api("/api/status")}catch(e){s={phase:"idle"}}
  st=s;
  const map={idle:0,scanning:1,scanned:2,copying:3,copied:4,verifying:4,verified:4,finishing:5,done:5,error:0};
  step=map[s.phase]||0;
  if(s.phase==="idle"){nav("home")}else{view="backup";nav("backup");}
  if(["scanning","copying","verifying"].includes(s.phase))poll();
  const t=CTX.t;
  if(t&&t.status&&!t.status.aceito)openGate();
  checkUpdate();
})();
</script>
